[workspace]
resolver = "2"
members = [
    "crates/dnsresolvr-core",
    "crates/dnsresolvr-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/brkbkts/dnsresolvr"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread", "sync", "io-util"] }
# Only the wire format is needed, not hickory's own transports.
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# TLS stack. Ring crypto backend keeps Windows builds NASM-free.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
# HTTP/2 for DoH, driven directly over our own rustls connection.
h2 = "0.4"
# QUIC stack for DoQ (RFC 9250) and DoH over HTTP/3. Same ring-based rustls as above.
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
